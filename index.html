<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lương 1177 - Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f5; margin: 0; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        .hidden { display: none; }
        input, button, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #ddd; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button.admin-btn { background: #28a745; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f4f4f4; }
        .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; pb: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Màn hình Đăng nhập -->
    <div id="login-form">
        <h2>Đăng Nhập Hệ Thống</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button onclick="login()">Đăng Nhập</button>
    </div>

    <!-- Màn hình Chính -->
    <div id="main-content" class="hidden">
        <div class="header-info">
            <span id="user-email" style="font-weight: bold;"></span>
            <button onclick="logout()" style="width: auto; padding: 5px 15px; background: #dc3545;">Thoát</button>
        </div>

        <div id="admin-panel" class="hidden" style="background: #fff3cd; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
            <strong>Chế độ Quản trị:</strong> Xem tất cả nhân viên
        </div>

        <h3>Nhập Công Ngày</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="date" id="workDate">
            <input type="number" id="breakMin" value="45" placeholder="Nghỉ (phút)">
            <input type="time" id="timeIn" value="08:00">
            <input type="time" id="timeOut" value="17:00">
        </div>
        <button onclick="saveData()">LƯU DỮ LIỆU</button>

        <hr>
        <h3>Báo Cáo & Lịch Sử</h3>
        <div style="display: flex; gap: 10px;">
            <select id="filterMonth"><option value="01">Tháng 1</option><option value="02">Tháng 2</option><!-- Thêm các tháng khác --><option value="05" selected>Tháng 5</option></select>
            <button class="admin-btn" onclick="exportExcel()">Xuất Excel</button>
        </div>

        <table id="salaryTable">
            <thead>
                <tr>
                    <th>Ngày</th>
                    <th>Nhân viên</th>
                    <th>Tổng giờ</th>
                    <th>Thành tiền</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <h4 id="totalSummary" style="text-align: right; color: red;"></h4>
    </div>
</div>

<script>
    // Cấu hình Firebase của bạn
    const firebaseConfig = {
        apiKey: "AIzaSyDzp1rjYmoxb8iFfMd0mcwgqeVimP4LXkw",
        authDomain: "quanlyluong2026.firebaseapp.com",
        projectId: "quanlyluong2026",
        storageBucket: "quanlyluong2026.firebasestorage.app",
        messagingSenderId: "293176773446",
        appId: "1:293176773446:web:f736157bfdbce598fab347"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const ADMIN_EMAIL = "admin@1177.com"; // Thay bằng email admin của bạn

    // --- Xử lý Đăng nhập ---
    function login() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(e, p).catch(err => alert("Lỗi: " + err.message));
    }

    function logout() { auth.signOut(); location.reload(); }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('user-email').innerText = user.email;
            if(user.email === ADMIN_EMAIL) document.getElementById('admin-panel').classList.remove('hidden');
            loadData(user);
        }
    });

    // --- Lưu dữ liệu ---
    async function saveData() {
        const user = auth.currentUser;
        const date = document.getElementById('workDate').value;
        const tIn = document.getElementById('timeIn').value;
        const tOut = document.getElementById('timeOut').value;
        const bMin = parseInt(document.getElementById('breakMin').value);

        const start = new Date(`2026-01-01 ${tIn}`);
        const end = new Date(`2026-01-01 ${tOut}`);
        let totalHrs = (end - start) / (3600000) - (bMin / 60);
        let salary = totalHrs > 8 ? (8 * 1177) + ((totalHrs - 8) * 1177 * 1.25) : totalHrs * 1177;

        await db.collection("bang_luong").add({
            uid: user.uid,
            email: user.email,
            ngay: date,
            tong_gio: totalHrs.toFixed(2),
            thanh_tien: Math.round(salary),
            thang: date.substring(5, 7)
        });
        alert("Đã lưu!");
    }

    // --- Tải dữ liệu & Báo cáo ---
    function loadData(user) {
        let query = db.collection("bang_luong");
        if (user.email !== ADMIN_EMAIL) {
            query = query.where("uid", "==", user.uid);
        }

        query.onSnapshot(snapshot => {
            let html = '';
            let totalMonth = 0;
            snapshot.forEach(doc => {
                const d = doc.data();
                totalMonth += d.thanh_tien;
                html += `<tr><td>${d.ngay}</td><td>${d.email}</td><td>${d.tong_gio}</td><td>${d.thanh_tien.toLocaleString()} ¥</td></tr>`;
            });
            document.getElementById('tableBody').innerHTML = html;
            document.getElementById('totalSummary').innerText = `Tổng cộng: ${totalMonth.toLocaleString()} ¥`;
        });
    }

    // --- Xuất Excel ---
    function exportExcel() {
        const table = document.getElementById("salaryTable");
        const wb = XLSX.utils.table_to_book(table);
        XLSX.writeFile(wb, "BaoCaoLuong_1177.xlsx");
    }
</script>
</body>
</html>
