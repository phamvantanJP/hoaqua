<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lương 2026 (Fixed)</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0056b3; --success: #28a745; --danger: #dc3545; --warning: #ffc107; --info: #17a2b8; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 8px; }
        .container { max-width: 1000px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin: 4px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; padding: 10px; }
        .btn-main { background: var(--primary); color: white; width: 100%; text-transform: uppercase; margin-top: 10px; }
        .btn-sm { color: white; padding: 6px 12px; }
        .bg-success { background: var(--success); }
        .bg-danger { background: var(--danger); }
        .bg-warning { background: var(--warning); color: black; }
        .bg-info { background: var(--info); }
        .hidden { display: none !important; }
        .table-wrapper { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f4f4f4; }
        .preview-salary { background: #fff3cd; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin-top: 10px; border: 1px dashed #856404; }
        
        /* Modal Style cho đổi mật khẩu */
        #pw-modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:1000; }
        .modal-content { background:white; padding:20px; border-radius:12px; width:90%; max-width:320px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGIN -->
    <div id="auth-section" class="card" style="max-width:350px; margin:50px auto;">
        <h2 id="auth-title" style="text-align:center">Đăng Nhập 2026</h2>
        <div id="reg-fields" class="hidden"><label>Họ Tên</label><input type="text" id="fullName"></div>
        <label>Email</label><input type="email" id="email">
        <label>Mật khẩu</label><input type="password" id="password">
        <button class="btn-main" onclick="handleAuth()" id="btn-auth">Đăng Nhập</button>
        <p onclick="toggleAuth()" id="toggle-text" style="text-align:center; color:blue; cursor:pointer; font-size:12px; margin-top:10px">Chưa có tài khoản? Đăng ký</p>
    </div>

    <!-- MAIN -->
    <div id="main-content" class="hidden">
        <div class="card" style="display:flex; justify-content:space-between; align-items:center">
            <span>Chào: <b id="user-name"></b></span>
            <div>
                <button onclick="openPwModal()" class="bg-info btn-sm">Đổi mật khẩu</button>
                <button onclick="logout()" class="bg-danger btn-sm">Thoát</button>
            </div>
        </div>

        <div class="card">
            <h3>Nhập Công</h3>
            <input type="hidden" id="edit-id">
            <label>Ngày làm việc</label>
            <input type="date" id="workDate" onchange="syncFilterWithDate()">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                <div><label>Vào</label><input type="time" id="timeIn" value="08:00" oninput="calculatePreview()"></div>
                <div><label>Ra</label><input type="time" id="timeOut" value="17:00" oninput="calculatePreview()"></div>
                <div><label>Giải lao (phút)</label><input type="number" id="breakMin" value="45" oninput="calculatePreview()"></div>
            </div>
            <div id="salary-preview" class="preview-salary">Dự tính: 0 ¥</div>
            <button class="btn-main" onclick="saveData()" id="btn-save">LƯU DỮ LIỆU</button>
            <button id="btn-cancel" class="hidden" onclick="resetForm()" style="width:100%; margin-top:5px; background:#6c757d; color:white">Hủy</button>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center">
                <select id="filterMonthYear" style="width:180px" onchange="loadData()"></select>
                <button onclick="exportExcel()" class="bg-success btn-sm">XUẤT EXCEL</button>
            </div>
            <div class="table-wrapper">
                <table id="table-to-export">
                    <thead><tr><th>Ngày</th><th>Tên</th><th>Giờ</th><th>Công</th><th>OT</th><th>Tiền</th><th>Lệnh</th></tr></thead>
                    <tbody id="dataBody"></tbody>
                    <tfoot id="dataFooter"></tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODAL ĐỔI MẬT KHẨU (ẨN MẶC ĐỊNH) -->
<div id="pw-modal" class="hidden">
    <div class="modal-content">
        <h3 style="margin-top:0; text-align:center">Đổi Mật Khẩu</h3>
        <label>Mật khẩu cũ</label><input type="password" id="oldPass">
        <label>Mật khẩu mới</label><input type="password" id="newPass">
        <label>Xác nhận mật khẩu mới</label><input type="password" id="confirmPass">
        <button class="btn-main" onclick="submitChangePassword()">CẬP NHẬT</button>
        <button onclick="closePwModal()" style="width:100%; margin-top:8px; background:#f8f9fa; border:1px solid #ddd; color:#333">HỦY</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDzp1rjYmoxb8iFfMd0mcwgqeVimP4LXkw",
        authDomain: "quanlyluong2026.firebaseapp.com",
        projectId: "quanlyluong2026",
        storageBucket: "quanlyluong2026.firebasestorage.app",
        messagingSenderId: "293176773446",
        appId: "1:293176773446:web:f736157bfdbce598fab347"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const RATE_BASE = 1177; 
    const RATE_OT = Math.round(1177 * 1.25);
    let isLoginMode = true;

    function toggleAuth() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
        document.getElementById('reg-fields').classList.toggle('hidden', isLoginMode);
    }

    async function handleAuth() {
        const e = document.getElementById('email').value, p = document.getElementById('password').value;
        try {
            if(isLoginMode) await auth.signInWithEmailAndPassword(e, p);
            else {
                const n = document.getElementById('fullName').value;
                const res = await auth.createUserWithEmailAndPassword(e, p);
                await res.user.updateProfile({ displayName: n });
            }
            location.reload();
        } catch(err) { alert(err.message); }
    }

    function logout() { auth.signOut(); location.reload(); }

    // --- XỬ LÝ ĐỔI MẬT KHẨU ---
    function openPwModal() { document.getElementById('pw-modal').classList.remove('hidden'); }
    function closePwModal() { document.getElementById('pw-modal').classList.add('hidden'); }

    async function submitChangePassword() {
        const user = auth.currentUser;
        const oldP = document.getElementById('oldPass').value;
        const newP = document.getElementById('newPass').value;
        const confP = document.getElementById('confirmPass').value;

        if(!oldP || !newP || !confP) return alert("Vui lòng điền đủ thông tin!");
        if(newP !== confP) return alert("Mật khẩu xác nhận không khớp!");
        if(newP.length < 6) return alert("Mật khẩu mới phải ít nhất 6 ký tự!");

        try {
            const credential = firebase.auth.EmailAuthProvider.credential(user.email, oldP);
            await user.reauthenticateWithCredential(credential);
            await user.updatePassword(newP);
            alert("Đổi mật khẩu thành công!");
            closePwModal();
        } catch (err) { alert("Lỗi: " + err.message); }
    }

    function syncFilterWithDate() {
        const date = document.getElementById('workDate').value;
        if(date) {
            const ym = date.substring(0, 7);
            const filter = document.getElementById('filterMonthYear');
            filter.value = ym;
            loadData();
            calculatePreview();
        }
    }

    function getCalc() {
        const d = document.getElementById('workDate').value || "2026-05-14";
        const t1 = new Date(`${d}T${document.getElementById('timeIn').value}`);
        let t2 = new Date(`${d}T${document.getElementById('timeOut').value}`);
        if(t2 <= t1) t2.setDate(t2.getDate() + 1);
        let total = (t2 - t1)/3600000 - (document.getElementById('breakMin').value/60);
        total = Math.max(0, total);
        let b = Math.min(8, total), ot = Math.max(0, total - 8);
        return { b: b.toFixed(2), ot: ot.toFixed(2), m: Math.round(b*RATE_BASE + ot*RATE_OT) };
    }

    function calculatePreview() {
        const res = getCalc();
        document.getElementById('salary-preview').innerText = `${res.b}h + ${res.ot}h OT = ${res.m.toLocaleString()} ¥`;
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('user-name').innerText = user.displayName || user.email;
            initFilter();
            const today = new Date().toLocaleDateString('en-CA');
            document.getElementById('workDate').value = today;
            syncFilterWithDate();
        }
    });

    async function saveData() {
        const u = auth.currentUser, d = document.getElementById('workDate').value, id = document.getElementById('edit-id').value;
        if(!d) return alert("Chọn ngày!");
        const res = getCalc(), ym = d.substring(0, 7);
        const data = {
            uid: u.uid, ho_ten: u.displayName || u.email, ngay: d,
            gio_vao: document.getElementById('timeIn').value, gio_ra: document.getElementById('timeOut').value,
            giai_lao: document.getElementById('breakMin').value, gio_lam: res.b, tang_ca: res.ot,
            thanh_tien: res.m, thang_nam: ym
        };
        try {
            if(id) await db.collection("bang_luong").doc(id).update(data);
            else await db.collection("bang_luong").add(data);
            alert("Đã lưu dữ liệu!");
            resetForm();
        } catch(e) { alert(e.message); }
    }

    // HÀM XÓA DỮ LIỆU
    async function deleteData(id) {
        if(confirm("Bạn có chắc chắn muốn xóa bản ghi này?")) {
            try {
                await db.collection("bang_luong").doc(id).delete();
            } catch(e) { alert(e.message); }
        }
    }

    function loadData() {
        const val = document.getElementById('filterMonthYear').value;
        const u = auth.currentUser;
        if(!val || !u) return;
        let q = db.collection("bang_luong").where("thang_nam", "==", val);
        if(u.email !== "phamvantan@gmail.com") q = q.where("uid", "==", u.uid);

        q.onSnapshot(snap => {
            let html = '', sH = 0, sO = 0, sM = 0, docs = [];
            snap.forEach(d => docs.push({id: d.id, ...d.data()}));
            docs.sort((a,b) => a.ngay.localeCompare(b.ngay));
            docs.forEach(d => {
                sH += parseFloat(d.gio_lam); sO += parseFloat(d.tang_ca); sM += parseInt(d.thanh_tien);
                html += `<tr>
                    <td>${d.ngay}</td>
                    <td>${d.ho_ten}</td>
                    <td>${d.gio_vao}-${d.gio_ra}</td>
                    <td>${d.gio_lam}</td>
                    <td>${d.tang_ca}</td>
                    <td>${d.thanh_tien.toLocaleString()}</td>
                    <td>
                        <button class="bg-warning" style="padding:4px 8px; margin-bottom:2px" onclick="editData('${d.id}','${d.ngay}','${d.gio_vao}','${d.gio_ra}',${d.giai_lao})">Sửa</button>
                        <button class="bg-danger" style="padding:4px 8px" onclick="deleteData('${d.id}')">Xóa</button>
                    </td>
                </tr>`;
            });
            document.getElementById('dataBody').innerHTML = html || '<tr><td colspan="7">Trống</td></tr>';
            document.getElementById('dataFooter').innerHTML = `<tr><td colspan="3">TỔNG</td><td>${sH.toFixed(2)}h</td><td>${sO.toFixed(2)}h</td><td colspan="2" style="color:red; font-weight:bold">${sM.toLocaleString()} ¥</td></tr>`;
        });
    }

    function editData(id, d, t1, t2, b) {
        document.getElementById('edit-id').value = id; document.getElementById('workDate').value = d;
        document.getElementById('timeIn').value = t1; document.getElementById('timeOut').value = t2;
        document.getElementById('breakMin').value = b; document.getElementById('btn-save').innerText = "CẬP NHẬT";
        document.getElementById('btn-cancel').classList.remove('hidden'); window.scrollTo(0,0);
        calculatePreview();
    }

    function resetForm() {
        document.getElementById('edit-id').value = ""; document.getElementById('btn-save').innerText = "LƯU DỮ LIỆU";
        document.getElementById('btn-cancel').classList.add('hidden');
    }

    function initFilter() {
        const s = document.getElementById('filterMonthYear');
        if(s.options.length > 0) return;
        for(let y = 2025; y <= 2026; y++) {
            for(let m = 1; m <= 12; m++) {
                let mm = m.toString().padStart(2, '0');
                let v = `${y}-${mm}`;
                s.add(new Option(`Tháng ${mm}/${y}`, v, v === "2026-05"));
            }
        }
    }

    function exportExcel() { XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("table-to-export")), `Luong.xlsx`); }
</script>
</body>
</html>
