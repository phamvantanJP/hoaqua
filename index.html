<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Công & Lương 2026</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0056b3; --success: #28a745; --danger: #dc3545; --warning: #ffc107; --dark: #343a40; --info: #17a2b8; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 8px; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 12px; border: 1px solid #e1e4e8; }
        input, select { width: 100%; padding: 10px; margin: 4px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 12px; height: 34px; display: inline-flex; align-items: center; justify-content: center; padding: 0 10px; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-main { background: var(--primary); color: white; width: 100%; margin-top: 8px; text-transform: uppercase; height: 42px; font-size: 14px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; }
        .btn-group { display: flex; gap: 4px; flex-wrap: wrap; }
        .bg-success { background: var(--success); color: white; }
        .bg-danger { background: var(--danger); color: white; }
        .bg-info { background: var(--info); color: white; }
        .bg-dark { background: var(--dark); color: white; }
        .hidden { display: none; }
        .table-wrapper { overflow-x: auto; margin-top: 10px; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; background: white; }
        th, td { border: 1px solid #dee2e6; padding: 8px; text-align: center; font-size: 12px; }
        th { background: #f8f9fa; position: sticky; top: 0; }
        .grid-inputs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        @media (max-width: 600px) {
            .grid-inputs div:first-child { grid-column: span 2; }
            button { font-size: 11px; padding: 0 6px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-section" class="card" style="max-width:360px; margin:40px auto;">
        <h2 style="text-align:center; font-size: 20px;">Hệ Thống 2026</h2>
        <div id="reg-fields" class="hidden"><input type="text" id="fullName" placeholder="Họ và Tên"></div>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button class="btn-main" onclick="handleAuth()">Đăng Nhập</button>
        <p style="text-align:center; color: var(--primary); cursor:pointer; font-size:13px;" onclick="toggleAuth()" id="toggle-text">Đăng ký tài khoản mới</p>
    </div>

    <div id="main-content" class="hidden">
        <div class="card header-bar">
            <div style="font-size:13px">Chào: <b id="user-name" style="color: var(--primary);"></b></div>
            <div class="btn-group">
                <button onclick="switchTab('tab-profile')" class="bg-info">Cài đặt</button>
                <button onclick="logout()" class="bg-danger">Thoát</button>
            </div>
        </div>

        <div id="admin-menu" class="hidden">
            <div class="card" style="background: #fff3cd;">
                <h4 style="margin:0 0 10px 0; font-size:13px;">CẤU HÌNH HỆ THỐNG (ADMIN)</h4>
                <div class="grid-inputs">
                    <div><label style="font-size:11px">Lương cơ bản (1 công)</label><input type="number" id="cfg-salary" value="1177"></div>
                    <div><label style="font-size:11px">Lương tăng ca / giờ</label><input type="number" id="cfg-ot" value="150"></div>
                </div>
                <button class="bg-dark" style="width:100%; margin-top:5px;" onclick="saveConfig()">LƯU CẤU HÌNH LƯƠNG</button>
                <div class="btn-group" style="margin-top:10px;">
                    <button onclick="switchTab('tab-cong')" class="bg-success" style="flex:1">Lịch Công</button>
                    <button onclick="switchTab('tab-users')" class="bg-dark" style="flex:1">Nhân Sự</button>
                </div>
            </div>
        </div>

        <div id="tab-cong">
            <div class="card">
                <h3 style="margin:0 0 10px 0; font-size:15px;">Nhập Dữ Liệu</h3>
                <input type="hidden" id="edit-id">
                <div class="grid-inputs">
                    <div><label style="font-size:11px">Ngày</label><input type="date" id="workDate"></div>
                    <div><label style="font-size:11px">Phụ cấp/Thưởng (nếu có)</label><input type="number" id="bonus" value="0"></div>
                    <div><label style="font-size:11px">Giờ vào</label><input type="time" id="timeIn" value="08:00"></div>
                    <div><label style="font-size:11px">Giờ ra</label><input type="time" id="timeOut" value="17:00"></div>
                </div>
                <button class="btn-main" onclick="saveData()" id="btn-save">LƯU DỮ LIỆU</button>
            </div>

            <div class="card">
                <div style="display:flex; justify-content: space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                    <select id="filterMonth" onchange="loadData()" style="width:120px; margin:0;"></select>
                    <div class="btn-group">
                        <button onclick="exportExcel('detail')" class="bg-info">📥 Xuất Chi Tiết</button>
                        <button onclick="exportExcel('summary')" class="bg-success">📊 Xuất Tổng Hợp</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr id="table-header"></tr></thead>
                        <tbody id="dataBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tab-profile" class="hidden">
            <div class="card" style="max-width:350px; margin: auto;">
                <h3 style="font-size:16px; text-align:center;">Đổi Mật Khẩu</h3>
                <input type="password" id="old-pass" placeholder="Mật khẩu cũ">
                <input type="password" id="new-pass" placeholder="Mật khẩu mới">
                <input type="password" id="renew-pass" placeholder="Xác nhận mật khẩu mới">
                <button class="btn-main" onclick="changePassword()">CẬP NHẬT</button>
                <button class="btn-main" style="background:#6c757d;" onclick="switchTab('tab-cong')">QUAY LẠI</button>
            </div>
        </div>

        <div id="tab-users" class="hidden">
            <div class="card">
                <h3>Danh sách nhân sự</h3>
                <div class="table-wrapper"><table id="userTable"><thead><tr><th>Tên</th><th>Email</th><th>Xóa</th></tr></thead><tbody id="userListBody"></tbody></table></div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDzp1rjYmoxb8iFfMd0mcwgqeVimP4LXkw",
        authDomain: "quanlyluong2026.firebaseapp.com",
        projectId: "quanlyluong2026",
        storageBucket: "quanlyluong2026.firebasestorage.app",
        messagingSenderId: "293176773446",
        appId: "1:293176773446:web:f736157bfdbce598fab347"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const ADMIN_LIST = ["admin@1177.com", "phamvantan@gmail.com"];
    let isLoginMode = true;
    let currentData = [];
    let systemConfig = { salary: 1177, ot: 150 };

    // --- CẤU HÌNH ---
    async function loadConfig() {
        const doc = await db.collection("settings").doc("salary_config").get();
        if(doc.exists) {
            systemConfig = doc.data();
            document.getElementById('cfg-salary').value = systemConfig.salary;
            document.getElementById('cfg-ot').value = systemConfig.ot;
        }
    }
    async function saveConfig() {
        const s = parseInt(document.getElementById('cfg-salary').value);
        const o = parseInt(document.getElementById('cfg-ot').value);
        await db.collection("settings").doc("salary_config").set({ salary: s, ot: o });
        systemConfig = { salary: s, ot: o };
        alert("Đã cập nhật mức lương mới cho hệ thống!");
        loadData();
    }

    // --- AUTH ---
    function toggleAuth() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
        document.getElementById('reg-fields').classList.toggle('hidden', isLoginMode);
    }
    async function handleAuth() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        try {
            if (isLoginMode) await auth.signInWithEmailAndPassword(e, p);
            else {
                const n = document.getElementById('fullName').value;
                const res = await auth.createUserWithEmailAndPassword(e, p);
                await res.user.updateProfile({ displayName: n });
                await db.collection("users").doc(res.user.uid).set({ ho_ten: n, email: e });
                location.reload();
            }
        } catch (err) { alert(err.message); }
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('user-name').innerText = user.displayName || user.email;
            const isAdmin = ADMIN_LIST.includes(user.email);
            if(isAdmin) { document.getElementById('admin-menu').classList.remove('hidden'); loadUserList(); loadConfig(); }
            initFilter(); renderTableHeader(isAdmin); loadData();
        } else {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
        }
    });

    // --- DỮ LIỆU ---
    function renderTableHeader(isAdmin) {
        let h = `<th>Ngày</th><th>Tên</th><th>Giờ</th><th>Công</th><th>TC</th><th>Thưởng</th>`;
        h += isAdmin ? `<th>Duyệt</th><th>Sửa/Xóa</th>` : `<th>Thao tác</th>`;
        document.getElementById('table-header').innerHTML = h;
    }

    function loadData() {
        const user = auth.currentUser;
        const m = document.getElementById('filterMonth').value;
        const isAdmin = ADMIN_LIST.includes(user.email);
        let q = db.collection("bang_luong").where("thang", "==", m);
        if(!isAdmin) q = q.where("uid", "==", user.uid);

        q.onSnapshot(snap => {
            let html = ''; currentData = [];
            snap.forEach(doc => {
                const d = doc.data(); d.id = doc.id;
                currentData.push(d);
                const approved = d.status === 'approved';
                html += `<tr><td>${d.ngay.split('-').reverse().slice(0,2).join('/')}</td><td>${d.ho_ten}</td><td>${d.gio_vao}-${d.gio_ra}</td><td>${d.gio_lam}</td><td>${d.tang_ca}</td><td>${d.bonus || 0}</td>`;
                if(isAdmin) {
                    html += `<td>${approved?'✅':'⏳'}</td><td><div class="btn-group">
                        <button class="bg-info btn-sm" onclick="editEntry('${d.id}')">Sửa</button>
                        <button class="bg-danger btn-sm" onclick="deleteData('${d.id}')">Xóa</button>
                    </div></td>`;
                } else {
                    html += `<td>${approved?'🔒':`<button class="bg-danger btn-sm" onclick="deleteData('${d.id}')">Xóa</button>`}</td>`;
                }
                html += `</tr>`;
            });
            document.getElementById('dataBody').innerHTML = html || '<tr><td colspan="8">Trống</td></tr>';
        });
    }

    async function saveData() {
        const user = auth.currentUser;
        const id = document.getElementById('edit-id').value;
        const date = document.getElementById('workDate').value;
        const tIn = document.getElementById('timeIn').value;
        const tOut = document.getElementById('timeOut').value;
        const bMin = parseInt(document.getElementById('breakMin').value) || 0;
        const bonus = parseInt(document.getElementById('bonus').value) || 0;
        if(!date) return alert("Chọn ngày!");

        let diff = (new Date(`2026-01-01 ${tOut}`) - new Date(`2026-01-01 ${tIn}`)) / 3600000;
        if(diff < 0) diff += 24;
        let total = Math.max(0, diff - (bMin/60));
        
        const payload = {
            uid: user.uid, ho_ten: user.displayName || user.email,
            ngay: date, gio_vao: tIn, gio_ra: tOut, giai_lao: bMin, bonus: bonus,
            gio_lam: total > 8 ? 8 : total.toFixed(2),
            tang_ca: total > 8 ? (total - 8).toFixed(2) : 0,
            thang: date.substring(5,7), status: 'pending'
        };

        if(id) await db.collection("bang_luong").doc(id).update(payload);
        else await db.collection("bang_luong").add(payload);
        
        document.getElementById('edit-id').value = "";
        document.getElementById('btn-save').innerText = "LƯU DỮ LIỆU";
        document.getElementById('bonus').value = 0;
        alert("Đã cập nhật!");
    }

    function editEntry(id) {
        const item = currentData.find(x => x.id === id);
        document.getElementById('edit-id').value = id;
        document.getElementById('workDate').value = item.ngay;
        document.getElementById('timeIn').value = item.gio_vao;
        document.getElementById('timeOut').value = item.gio_ra;
        document.getElementById('bonus').value = item.bonus || 0;
        document.getElementById('btn-save').innerText = "CẬP NHẬT DÒNG NÀY";
        window.scrollTo(0,0);
    }

    // --- XUẤT EXCEL ---
    function exportExcel(type) {
        if(currentData.length === 0) return alert("Không có dữ liệu!");
        let dataToExport = [];
        const m = document.getElementById('filterMonth').value;

        if(type === 'detail') {
            dataToExport = currentData.map(i => ({
                "Ngày": i.ngay, "Nhân viên": i.ho_ten, "Vào": i.gio_vao, "Ra": i.gio_ra, "Công": i.gio_lam, "TC": i.tang_ca, "Phụ cấp/Thưởng": i.bonus || 0
            }));
        } else {
            // TỔNG HỢP: Gom nhóm theo tên
            const summary = {};
            currentData.forEach(i => {
                if(!summary[i.ho_ten]) summary[i.ho_ten] = { ten: i.ho_ten, cong: 0, tc: 0, bonus: 0 };
                summary[i.ho_ten].cong += parseFloat(i.gio_lam);
                summary[i.ho_ten].tc += parseFloat(i.tang_ca);
                summary[i.ho_ten].bonus += parseInt(i.bonus || 0);
            });
            dataToExport = Object.values(summary).map(s => {
                const tienCong = (s.cong / 8) * systemConfig.salary; // Tính theo đơn giá công admin cài
                const tienTC = s.tc * systemConfig.ot;
                return {
                    "Tên Nhân Viên": s.ten,
                    "Tổng Công (Giờ)": s.cong.toFixed(2),
                    "Ngày Công quy đổi": (s.cong / 8).toFixed(2),
                    "Tổng Tăng Ca": s.tc.toFixed(2),
                    "Tổng Phụ Cấp/Thưởng": s.bonus,
                    "THÀNH TIỀN (VNĐ)": Math.round(tienCong + tienTC + s.bonus).toLocaleString()
                };
            });
        }

        const ws = XLSX.utils.json_to_sheet(dataToExport);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Bao_Cao");
        XLSX.writeFile(wb, `Bao_Cao_${type}_Thang_${m}.xlsx`);
    }

    // --- TIỆN ÍCH ---
    function switchTab(t) {
        ['tab-cong', 'tab-users', 'tab-profile'].forEach(id => document.getElementById(id).classList.toggle('hidden', id !== t));
    }
    async function deleteData(id) { if(confirm("Xóa dòng này?")) await db.collection("bang_luong").doc(id).delete(); }
    async function approve(id) { await db.collection("bang_luong").doc(id).update({status:'approved'}); }
    function logout() { auth.signOut(); location.reload(); }
    function initFilter() {
        const s = document.getElementById('filterMonth');
        if(s.options.length > 0) return;
        const curr = new Date().getMonth() + 1;
        for(let i=1; i<=12; i++) {
            let v = i < 10 ? '0'+i : i;
            s.add(new Option("Tháng " + v, v, i === curr, i === curr));
        }
        document.getElementById('workDate').valueAsDate = new Date();
    }
    function loadUserList() {
        db.collection("users").onSnapshot(snap => {
            let h = ''; snap.forEach(doc => {
                h += `<tr><td>${doc.data().ho_ten}</td><td>${doc.data().email}</td><td><button class="bg-danger" onclick="deleteUser('${doc.id}')">Xóa</button></td></tr>`;
            });
            document.getElementById('userListBody').innerHTML = h;
        });
    }
    async function deleteUser(id) { if(confirm("Xóa tài khoản này?")) await db.collection("users").doc(id).delete(); }
</script>
</body>
</html>
