<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lương 1177 - Admin Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f5; margin: 0; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 1000px; margin: auto; }
        .hidden { display: none; }
        input, button, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button.admin-btn { background: #28a745; }
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f8f9fa; }
        .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .summary-section { margin-top: 30px; padding: 15px; border: 2px solid #28a745; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-form">
        <h2 style="text-align: center;">Hệ Thống 1177 - Đăng Nhập</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button onclick="login()">ĐĂNG NHẬP</button>
    </div>

    <div id="main-content" class="hidden">
        <div class="header-info">
            <div>Chào Admin: <span id="user-email" style="color: #28a745; font-weight: bold;"></span></div>
            <button onclick="logout()" style="width: auto; background: #dc3545; padding: 5px 15px;">Thoát</button>
        </div>

        <h3>Nhập Công Ngày</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div><label>Ngày:</label><input type="date" id="workDate"></div>
            <div><label>Nghỉ (phút):</label><input type="number" id="breakMin" value="60"></div>
            <div><label>Vào:</label><input type="time" id="timeIn" value="08:00"></div>
            <div><label>Ra:</label><input type="time" id="timeOut" value="17:00"></div>
        </div>
        <button onclick="saveData()" style="margin-top: 10px; background: #0056b3;">LƯU CÔNG</button>

        <hr>
        
        <h3>Tra Cứu & Báo Cáo</h3>
        <div style="display: flex; gap: 10px;">
            <select id="filterMonth" onchange="loadData()">
                <option value="01">Tháng 1</option><option value="02">Tháng 2</option>
                <option value="03">Tháng 3</option><option value="04">Tháng 4</option>
                <option value="05" selected>Tháng 5</option><option value="06">Tháng 6</option>
                <option value="07">Tháng 7</option><option value="08">Tháng 8</option>
                <option value="09">Tháng 9</option><option value="10">Tháng 10</option>
                <option value="11">Tháng 11</option><option value="12">Tháng 12</option>
            </select>
            <button class="admin-btn" onclick="exportDetail()">Xuất Chi Tiết</button>
        </div>

        <div class="table-responsive">
            <table id="detailTable">
                <thead>
                    <tr>
                        <th>Ngày</th><th>Nhân viên</th><th>Vào</th><th>Ra</th><th>Nghỉ</th><th>Cơ bản</th><th>Tăng ca</th><th>Thành tiền</th>
                    </tr>
                </thead>
                <tbody id="detailBody"></tbody>
            </table>
        </div>

        <!-- PHẦN CHỈ ADMIN MỚI THẤY -->
        <div id="admin-only-section" class="hidden summary-section">
            <h3 style="color: #28a745;">Bảng Tổng Hợp Lương Nhân Viên</h3>
            <button class="admin-btn" onclick="exportSummary()" style="margin-bottom: 10px;">XUẤT BÁO CÁO TỔNG HỢP (EXCEL)</button>
            <div class="table-responsive">
                <table id="summaryTable">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Tên nhân viên</th>
                            <th>Số ngày công</th>
                            <th>Tổng giờ làm</th>
                            <th>Tổng tăng ca</th>
                            <th>Phụ cấp</th>
                            <th>Tổng Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody id="summaryBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDzp1rjYmoxb8iFfMd0mcwgqeVimP4LXkw",
        authDomain: "quanlyluong2026.firebaseapp.com",
        projectId: "quanlyluong2026",
        storageBucket: "quanlyluong2026.firebasestorage.app",
        messagingSenderId: "293176773446",
        appId: "1:293176773446:web:f736157bfdbce598fab347"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const ADMIN_EMAIL = "admin@1177.com";

    function login() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(e, p).catch(err => alert("Lỗi: " + err.message));
    }

    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('user-email').innerText = user.email.split('@')[0].toUpperCase();
            document.getElementById('workDate').valueAsDate = new Date();
            
            if(user.email === ADMIN_EMAIL) {
                document.getElementById('admin-only-section').classList.remove('hidden');
            }
            loadData();
        } else {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
        }
    });

    async function saveData() {
        const user = auth.currentUser;
        const date = document.getElementById('workDate').value;
        const tIn = document.getElementById('timeIn').value;
        const tOut = document.getElementById('timeOut').value;
        const bMin = parseInt(document.getElementById('breakMin').value) || 0;

        const start = new Date(`2026-01-01 ${tIn}`);
        const end = new Date(`2026-01-01 ${tOut}`);
        let diff = (end - start) / 3600000;
        if (diff < 0) diff += 24;
        let totalHrs = Math.max(0, diff - (bMin / 60));

        let basic = totalHrs > 8 ? 8 : totalHrs;
        let ot = totalHrs > 8 ? (totalHrs - 8) : 0;
        let money = (basic * 1177) + (ot * 1177 * 1.25);

        await db.collection("bang_luong").add({
            uid: user.uid, email: user.email, ngay: date,
            gio_vao: tIn, gio_ra: tOut, gio_nghi: bMin,
            tong_gio: totalHrs.toFixed(2), gio_co_ban: basic.toFixed(2),
            gio_tang_ca: ot.toFixed(2), thanh_tien: Math.round(money),
            thang: date.substring(5, 7)
        });
        alert("Đã lưu!");
        document.getElementById('timeIn').value = "08:00";
        document.getElementById('timeOut').value = "17:00";
    }

    function loadData() {
        const user = auth.currentUser;
        const month = document.getElementById('filterMonth').value;
        let query = db.collection("bang_luong").where("thang", "==", month);
        
        if (user.email !== ADMIN_EMAIL) query = query.where("uid", "==", user.uid);

        query.orderBy("ngay", "asc").onSnapshot(snapshot => {
            let detailHtml = '';
            let summaryData = {}; // Object để gom nhóm theo nhân viên
            
            snapshot.forEach(doc => {
                const d = doc.data();
                const name = d.email.split('@')[0].toUpperCase();

                // 1. Đổ bảng chi tiết
                detailHtml += `<tr><td>${d.ngay}</td><td>${name}</td><td>${d.gio_vao}</td><td>${d.gio_ra}</td><td>${d.gio_nghi}m</td><td>${d.gio_co_ban}</td><td>${d.gio_tang_ca}</td><td>${d.thanh_tien.toLocaleString()} ¥</td></tr>`;

                // 2. Gom dữ liệu cho bảng tổng hợp (chỉ dành cho Admin)
                if (!summaryData[name]) {
                    summaryData[name] = { count: 0, totalHrs: 0, totalOt: 0, totalMoney: 0 };
                }
                summaryData[name].count += 1;
                summaryData[name].totalHrs += parseFloat(d.tong_gio);
                summaryData[name].totalOt += parseFloat(d.gio_tang_ca);
                summaryData[name].totalMoney += d.thanh_tien;
            });

            document.getElementById('detailBody').innerHTML = detailHtml;

            // Hiển thị bảng tổng hợp nếu là Admin
            if (user.email === ADMIN_EMAIL) {
                let summaryHtml = '';
                let stt = 1;
                for (let name in summaryData) {
                    summaryHtml += `<tr>
                        <td>${stt++}</td>
                        <td style="font-weight:bold; text-align:left;">${name}</td>
                        <td>${summaryData[name].count}</td>
                        <td>${summaryData[name].totalHrs.toFixed(2)}</td>
                        <td>${summaryData[name].totalOt.toFixed(2)}</td>
                        <td>0</td>
                        <td style="color:red; font-weight:bold;">${summaryData[name].totalMoney.toLocaleString()} ¥</td>
                    </tr>`;
                }
                document.getElementById('summaryBody').innerHTML = summaryHtml;
            }
        });
    }

    function exportDetail() {
        const wb = XLSX.utils.table_to_book(document.getElementById("detailTable"));
        XLSX.writeFile(wb, "Chi_Tiet_Cong_1177.xlsx");
    }

    function exportSummary() {
        const wb = XLSX.utils.table_to_book(document.getElementById("summaryTable"));
        XLSX.writeFile(wb, "Tong_Hop_Luong_Thang_" + document.getElementById('filterMonth').value + ".xlsx");
    }
</script>
</body>
</html>
