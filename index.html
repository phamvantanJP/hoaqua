<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Công 2026</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        :root { --primary: #0056b3; --success: #28a745; --danger: #dc3545; --warning: #ffc107; --dark: #343a40; --info: #17a2b8; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 8px; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; border: 1px solid #e1e4e8; }
        
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        /* Nút bấm đồng nhất kích thước */
        button { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.3s; font-size: 12px; height: 34px; display: inline-flex; align-items: center; justify-content: center; padding: 0 12px; }
        .btn-main { background: var(--primary); color: white; width: 100%; margin-top: 10px; text-transform: uppercase; height: 45px; font-size: 14px; }
        
        /* Header linh hoạt cho Mobile */
        .header-bar { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .user-info { font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .btn-group { display: flex; gap: 4px; }
        .bg-success { background: var(--success); color: white; }
        .bg-danger { background: var(--danger); color: white; }
        .bg-warning { background: var(--warning); color: black; }
        .bg-info { background: var(--info); color: white; }
        .bg-dark { background: var(--dark); color: white; }
        
        .hidden { display: none; }
        .table-wrapper { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { border: 1px solid #dee2e6; padding: 8px; text-align: center; font-size: 12px; }
        th { background: #f8f9fa; }

        .grid-inputs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        @media (max-width: 600px) {
            .grid-inputs div:first-child { grid-column: span 2; }
            button { font-size: 11px; padding: 0 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-section" class="card" style="max-width:360px; margin:40px auto;">
        <h2 id="auth-title" style="text-align:center; margin-bottom:20px;">Đăng Nhập</h2>
        <div id="reg-fields" class="hidden">
            <input type="text" id="fullName" placeholder="Họ và Tên">
        </div>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mật khẩu">
        <div id="retype-reg-fields" class="hidden">
            <input type="password" id="repassword" placeholder="Xác nhận mật khẩu">
        </div>
        <button class="btn-main" id="btn-auth" onclick="handleAuth()">Đăng Nhập</button>
        <p style="text-align:center; color: var(--primary); cursor:pointer; font-size:13px; margin-top:15px;" onclick="toggleAuth()" id="toggle-text">Chưa có tài khoản? Đăng ký</p>
    </div>

    <div id="main-content" class="hidden">
        <div class="card header-bar">
            <div class="user-info">Chào: <b id="user-name" style="color: var(--primary);"></b></div>
            <div class="btn-group">
                <button onclick="switchTab('tab-profile')" class="bg-info">Thiết lập</button>
                <button onclick="logout()" class="bg-danger">Thoát</button>
            </div>
        </div>

        <div id="tab-profile" class="hidden">
            <div class="card" style="max-width:350px; margin: 10px auto;">
                <h3 style="font-size:16px; text-align:center; margin-top:0;">Đổi Mật Khẩu</h3>
                <input type="password" id="old-pass" placeholder="Mật khẩu cũ">
                <input type="password" id="new-pass" placeholder="Mật khẩu mới">
                <input type="password" id="renew-pass" placeholder="Xác nhận mật khẩu mới">
                <button class="btn-main" onclick="changePassword()">XÁC NHẬN ĐỔI</button>
                <button class="btn-main" style="background:#6c757d; margin-top:5px;" onclick="switchTab('tab-cong')">QUAY LẠI</button>
            </div>
        </div>

        <div id="admin-menu" class="hidden card" style="background: #fff3cd;">
            <div class="btn-group" style="width:100%">
                <button onclick="switchTab('tab-cong')" class="bg-success" style="flex:1">Quản lý Lịch Công</button>
                <button onclick="switchTab('tab-users')" class="bg-dark" style="flex:1">Quản lý Nhân Sự</button>
            </div>
        </div>

        <div id="tab-cong">
            <div class="card">
                <h3 style="margin:0 0 10px 0; font-size:15px;">Nhập Công</h3>
                <div class="grid-inputs">
                    <div><label style="font-size:11px">Ngày</label><input type="date" id="workDate"></div>
                    <div><label style="font-size:11px">Nghỉ (phút)</label><input type="number" id="breakMin" value="45"></div>
                    <div><label style="font-size:11px">Giờ vào</label><input type="time" id="timeIn" value="08:00"></div>
                    <div><label style="font-size:11px">Giờ ra</label><input type="time" id="timeOut" value="17:00"></div>
                </div>
                <button class="btn-main" onclick="saveData()">LƯU DỮ LIỆU</button>
            </div>
            <div class="card">
                <select id="filterMonth" onchange="loadData()" style="width:130px"></select>
                <div class="table-wrapper">
                    <table>
                        <thead><tr id="table-header"></tr></thead>
                        <tbody id="dataBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tab-users" class="hidden">
            <div class="card">
                <h3 style="font-size:15px;">Nhân viên</h3>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Tên</th><th>Email</th><th>Thao tác</th></tr></thead>
                        <tbody id="userListBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Config Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDzp1rjYmoxb8iFfMd0mcwgqeVimP4LXkw",
        authDomain: "quanlyluong2026.firebaseapp.com",
        projectId: "quanlyluong2026",
        storageBucket: "quanlyluong2026.firebasestorage.app",
        messagingSenderId: "293176773446",
        appId: "1:293176773446:web:f736157bfdbce598fab347"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const ADMIN_LIST = ["admin@1177.com", "phamvantan@gmail.com"];
    let isLoginMode = true;

    function toggleAuth() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
        document.getElementById('reg-fields').classList.toggle('hidden', isLoginMode);
        document.getElementById('retype-reg-fields').classList.toggle('hidden', isLoginMode);
        document.getElementById('toggle-text').innerText = isLoginMode ? "Chưa có tài khoản? Đăng ký" : "Đã có tài khoản? Đăng nhập";
    }

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            if (isLoginMode) {
                await auth.signInWithEmailAndPassword(email, pass);
            } else {
                const name = document.getElementById('fullName').value;
                const res = await auth.createUserWithEmailAndPassword(email, pass);
                await res.user.updateProfile({ displayName: name });
                await db.collection("users").doc(res.user.uid).set({ ho_ten: name, email: email });
                location.reload();
            }
        } catch (e) { alert("Lỗi: " + e.message); }
    }

    async function changePassword() {
        const user = auth.currentUser;
        const oldP = document.getElementById('old-pass').value;
        const newP = document.getElementById('new-pass').value;
        const reP = document.getElementById('renew-pass').value;
        if(newP !== reP) return alert("Mật khẩu mới không khớp!");
        try {
            const cred = firebase.auth.EmailAuthProvider.credential(user.email, oldP);
            await user.reauthenticateWithCredential(cred);
            await user.updatePassword(newP);
            alert("Thành công!");
            switchTab('tab-cong');
        } catch (e) { alert("Mật khẩu cũ không chính xác!"); }
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('user-name').innerText = user.displayName || user.email;
            const isAdmin = ADMIN_LIST.includes(user.email);
            if(isAdmin) document.getElementById('admin-menu').classList.remove('hidden');
            initFilter(); renderTableHeader(isAdmin); loadData();
        } else {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
        }
    });

    function switchTab(t) {
        ['tab-cong', 'tab-users', 'tab-profile'].forEach(id => {
            document.getElementById(id).classList.toggle('hidden', id !== t);
        });
    }

    function renderTableHeader(isAdmin) {
        let h = `<th>Ngày</th><th>Tên</th><th>Giờ</th><th>Công</th><th>TC</th>`;
        h += isAdmin ? `<th>Duyệt</th><th>Sửa/Xóa</th>` : `<th>Thao tác</th>`;
        document.getElementById('table-header').innerHTML = h;
    }

    function loadData() {
        const user = auth.currentUser;
        const m = document.getElementById('filterMonth').value;
        const isAdmin = ADMIN_LIST.includes(user.email);
        let q = db.collection("bang_luong").where("thang", "==", m);
        if(!isAdmin) q = q.where("uid", "==", user.uid);

        q.onSnapshot(snap => {
            let html = '';
            snap.forEach(doc => {
                const d = doc.data();
                const approved = d.status === 'approved';
                html += `<tr><td>${d.ngay}</td><td>${d.ho_ten}</td><td>${d.gio_vao}-${d.gio_ra}</td><td>${d.gio_lam}</td><td>${d.tang_ca}</td>`;
                if(isAdmin) {
                    html += `<td>${approved?'✅':'⏳'}</td><td><div class="btn-group">
                        ${!approved?`<button class="bg-success btn-sm" onclick="approve('${doc.id}')">Duyệt</button>`:''}
                        <button class="bg-danger btn-sm" onclick="deleteData('${doc.id}')">Xóa</button>
                    </div></td>`;
                } else {
                    html += `<td>${approved?'🔒':`<button class="bg-danger btn-sm" onclick="deleteData('${doc.id}')">Xóa</button>`}</td>`;
                }
                html += `</tr>`;
            });
            document.getElementById('dataBody').innerHTML = html || '<tr><td colspan="7">Không có dữ liệu</td></tr>';
        });
    }

    async function saveData() {
        const user = auth.currentUser;
        const date = document.getElementById('workDate').value;
        const tIn = document.getElementById('timeIn').value;
        const tOut = document.getElementById('timeOut').value;
        const bMin = parseInt(document.getElementById('breakMin').value) || 0;
        
        let diff = (new Date(`2026-01-01 ${tOut}`) - new Date(`2026-01-01 ${tIn}`)) / 3600000;
        if(diff < 0) diff += 24;
        let total = Math.max(0, diff - (bMin/60));
        
        await db.collection("bang_luong").add({
            uid: user.uid, ho_ten: user.displayName || user.email,
            ngay: date, gio_vao: tIn, gio_ra: tOut, giai_lao: bMin,
            gio_lam: total > 8 ? 8 : total.toFixed(2),
            tang_ca: total > 8 ? (total - 8).toFixed(2) : 0,
            thang: date.substring(5,7), status: 'pending'
        });
        alert("Đã lưu!");
    }

    async function approve(id) { await db.collection("bang_luong").doc(id).update({status:'approved'}); }
    async function deleteData(id) { if(confirm("Xóa bản ghi này?")) await db.collection("bang_luong").doc(id).delete(); }
    function logout() { auth.signOut(); location.reload(); }
    
    function initFilter() {
        const s = document.getElementById('filterMonth');
        if(s.options.length > 0) return;
        const curr = new Date().getMonth() + 1;
        for(let i=1; i<=12; i++) {
            let v = i < 10 ? '0'+i : i;
            s.add(new Option("Tháng " + v, v, i === curr, i === curr));
        }
        document.getElementById('workDate').valueAsDate = new Date();
    }

    function loadUserList() {
        db.collection("users").onSnapshot(snap => {
            let h = '';
            snap.forEach(doc => {
                const u = doc.data();
                h += `<tr><td>${u.ho_ten}</td><td>${u.email}</td><td><button class="bg-danger btn-sm" onclick="deleteUser('${doc.id}')">Xóa</button></td></tr>`;
            });
            document.getElementById('userListBody').innerHTML = h;
        });
    }
    async function deleteUser(id) { if(confirm("Xóa nhân viên?")) await db.collection("users").doc(id).delete(); }
</script>
</body>
</html>
