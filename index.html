<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Công & Lương Đa Năm</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0056b3; --success: #28a745; --danger: #dc3545; --warning: #ffc107; --dark: #343a40; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 8px; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; border: 1px solid #e1e4e8; }
        input, select { width: 100%; padding: 10px; margin: 4px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none; }
        button { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.3s; font-size: 13px; }
        .btn-main { background: var(--primary); color: white; width: 100%; padding: 12px; margin-top: 8px; text-transform: uppercase; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 4px; }
        .btn-sm { padding: 6px 10px; color: white; flex: 1; min-width: 60px; text-align: center; }
        .bg-success { background: var(--success); }
        .bg-danger { background: var(--danger); }
        .bg-warning { background: var(--warning); color: black; }
        .hidden { display: none; }
        .table-wrapper { overflow-x: auto; background: white; border-radius: 8px; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #f8f9fa; position: sticky; top: 0; }
        .summary-row { background: #e9ecef; font-weight: bold; }
        .preview-salary { background: #fff3cd; padding: 12px; border-radius: 8px; margin: 10px 0; text-align: center; font-weight: bold; color: #856404; border: 1px dashed #856404; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- AUTH SECTION -->
    <div id="auth-section" class="card" style="max-width:380px; margin:40px auto;">
        <h2 id="auth-title" style="text-align:center;">Hệ Thống 2026+</h2>
        <div id="reg-fields" class="hidden">
            <label>Họ và Tên</label>
            <input type="text" id="fullName" placeholder="Nhập tên">
        </div>
        <label>Email</label>
        <input type="email" id="email" placeholder="example@gmail.com">
        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="••••••">
        <div id="retype-reg-fields" class="hidden">
            <label>Nhập lại mật khẩu</label>
            <input type="password" id="repassword" placeholder="••••••">
        </div>
        <button class="btn-main" id="btn-auth" onclick="handleAuth()">Đăng Nhập</button>
        <p style="text-align:center; color: var(--primary); cursor:pointer; font-size:13px;" onclick="toggleAuth()" id="toggle-text">Chưa có tài khoản? Đăng ký ngay</p>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content" class="hidden">
        <div class="card" style="display:flex; justify-content: space-between; align-items:center;">
            <div>Chào: <b id="user-name" style="color: var(--primary);"></b></div>
            <button onclick="logout()" class="btn-sm bg-danger" style="flex:none">Thoát</button>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">Nhập Công</h3>
            <input type="hidden" id="edit-id">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div style="grid-column: span 2;"><label>Ngày làm việc</label><input type="date" id="workDate" onchange="calculatePreview()"></div>
                <div><label>Giờ vào</label><input type="time" id="timeIn" value="08:00" oninput="calculatePreview()"></div>
                <div><label>Giờ ra</label><input type="time" id="timeOut" value="17:00" oninput="calculatePreview()"></div>
                <div><label>Giải lao (phút)</label><input type="number" id="breakMin" value="45" oninput="calculatePreview()"></div>
            </div>
            <div id="salary-preview" class="preview-salary">Dự tính: 0 ¥</div>
            <button class="btn-main" onclick="saveData()" id="btn-save">LƯU DỮ LIỆU</button>
            <button id="btn-cancel" class="hidden" onclick="resetForm()" style="width:100%; margin-top:5px; background:#6c757d; color:white; padding:10px">HỦY BỎ</button>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; margin-bottom:10px">
                <select id="filterMonthYear" style="width:180px;" onchange="loadData()"></select>
                <button class="btn-sm bg-success" onclick="exportExcel()">📥 XUẤT EXCEL</button>
            </div>
            <div class="table-wrapper">
                <table id="table-to-export">
                    <thead>
                        <tr><th>Ngày</th><th>Họ Tên</th><th>Giờ</th><th>Công(8h)</th><th>Tăng ca</th><th>Tiền Yên</th><th>Thao tác</th></tr>
                    </thead>
                    <tbody id="dataBody"></tbody>
                    <tfoot id="dataFooter"></tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CẤU HÌNH FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyDzp1rjYmoxb8iFfMd0mcwgqeVimP4LXkw",
        authDomain: "quanlyluong2026.firebaseapp.com",
        projectId: "quanlyluong2026",
        storageBucket: "quanlyluong2026.firebasestorage.app",
        messagingSenderId: "293176773446",
        appId: "1:293176773446:web:f736157bfdbce598fab347"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const ADMIN_LIST = ["admin@1177.com", "phamvantan@gmail.com"];
    const RATE_BASE = 1177; 
    const RATE_OT = Math.round(1177 * 1.25);
    let isLoginMode = true;

    // --- AUTH LOGIC ---
    function toggleAuth() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
        document.getElementById('btn-auth').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
        document.getElementById('reg-fields').classList.toggle('hidden', isLoginMode);
        document.getElementById('retype-reg-fields').classList.toggle('hidden', isLoginMode);
    }

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            if (isLoginMode) {
                await auth.signInWithEmailAndPassword(email, pass);
            } else {
                const name = document.getElementById('fullName').value;
                const repass = document.getElementById('repassword').value;
                if(!name || pass !== repass) return alert("Kiểm tra lại thông tin!");
                const res = await auth.createUserWithEmailAndPassword(email, pass);
                await res.user.updateProfile({ displayName: name });
                await db.collection("users").doc(res.user.uid).set({ ho_ten: name, email: email });
            }
        } catch (e) { alert("Lỗi: " + e.message); }
    }

    function logout() { auth.signOut(); location.reload(); }

    // --- TÍNH TOÁN ---
    function getCalc() {
        const workDate = document.getElementById('workDate').value || "2026-01-01";
        const tIn = document.getElementById('timeIn').value;
        const tOut = document.getElementById('timeOut').value;
        const bMin = parseInt(document.getElementById('breakMin').value) || 0;
        
        const start = new Date(`${workDate} ${tIn}`);
        let end = new Date(`${workDate} ${tOut}`);
        if (end <= start) end.setDate(end.getDate() + 1); // Xử lý ca đêm
        
        let totalHrs = (end - start) / 3600000 - (bMin / 60);
        totalHrs = Math.max(0, totalHrs);
        
        let basic = Math.min(8, totalHrs);
        let ot = Math.max(0, totalHrs - 8);
        let money = (basic * RATE_BASE) + (ot * RATE_OT);
        
        return { basic: basic.toFixed(2), ot: ot.toFixed(2), money: Math.round(money) };
    }

    function calculatePreview() {
        const res = getCalc();
        document.getElementById('salary-preview').innerText = `Dự tính: ${res.basic}h + ${res.ot}h OT = ${res.money.toLocaleString()} ¥`;
    }

    // --- DỮ LIỆU ---
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('user-name').innerText = user.displayName || user.email;
            initFilter();
            loadData();
            calculatePreview();
        } else {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
        }
    });

    async function saveData() {
        const user = auth.currentUser;
        const id = document.getElementById('edit-id').value;
        const date = document.getElementById('workDate').value;
        if(!date) return alert("Vui lòng chọn ngày!");

        const res = getCalc();
        const data = {
            uid: user.uid, 
            ho_ten: user.displayName || user.email,
            ngay: date, 
            gio_vao: document.getElementById('timeIn').value,
            gio_ra: document.getElementById('timeOut').value,
            giai_lao: parseInt(document.getElementById('breakMin').value),
            gio_lam: res.basic, 
            tang_ca: res.ot, 
            thanh_tien: res.money,
            thang_nam: date.substring(0, 7), // Định dạng 2026-05
            status: "pending"
        };

        try {
            if(id) await db.collection("bang_luong").doc(id).update(data);
            else await db.collection("bang_luong").add(data);
            alert("Đã lưu!");
            resetForm();
        } catch(e) { alert("Lỗi: " + e.message); }
    }

    function loadData() {
        const user = auth.currentUser;
        const filterVal = document.getElementById('filterMonthYear').value;
        const isAdmin = ADMIN_LIST.includes(user.email);
        
        let q = db.collection("bang_luong").where("thang_nam", "==", filterVal).orderBy("ngay", "asc");
        if (!isAdmin) q = q.where("uid", "==", user.uid);

        q.onSnapshot(snapshot => {
            let html = '';
            let sHrs = 0, sOt = 0, sPay = 0;
            snapshot.forEach(doc => {
                const d = doc.data();
                sHrs += parseFloat(d.gio_lam); sOt += parseFloat(d.tang_ca); sPay += parseInt(d.thanh_tien);
                html += `<tr>
                    <td>${d.ngay}</td><td>${d.ho_ten}</td><td>${d.gio_vao}-${d.gio_ra}</td>
                    <td>${d.gio_lam}</td><td>${d.tang_ca}</td><td>${d.thanh_tien.toLocaleString()} ¥</td>
                    <td>
                        <div class="btn-group">
                            <button class="btn-sm bg-warning" onclick="editData('${doc.id}','${d.ngay}','${d.gio_vao}','${d.gio_ra}',${d.giai_lao})">Sửa</button>
                            <button class="btn-sm bg-danger" onclick="deleteData('${doc.id}')">Xóa</button>
                        </div>
                    </td>
                </tr>`;
            });
            document.getElementById('dataBody').innerHTML = html || '<tr><td colspan="7">Không có dữ liệu tháng này</td></tr>';
            document.getElementById('dataFooter').innerHTML = `
                <tr class="summary-row">
                    <td colspan="3">TỔNG CỘNG (${filterVal})</td>
                    <td>${sHrs.toFixed(2)}h</td><td>${sOt.toFixed(2)}h</td>
                    <td colspan="2" style="color:red; font-size:15px;">${sPay.toLocaleString()} ¥</td>
                </tr>`;
        });
    }

    function editData(id, date, tIn, tOut, bMin) {
        document.getElementById('edit-id').value = id;
        document.getElementById('workDate').value = date;
        document.getElementById('timeIn').value = tIn;
        document.getElementById('timeOut').value = tOut;
        document.getElementById('breakMin').value = bMin;
        document.getElementById('btn-save').innerText = "CẬP NHẬT";
        document.getElementById('btn-cancel').classList.remove('hidden');
        calculatePreview();
        window.scrollTo(0,0);
    }

    async function deleteData(id) {
        if(confirm("Xóa bản ghi này?")) await db.collection("bang_luong").doc(id).delete();
    }

    function resetForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('btn-save').innerText = "LƯU DỮ LIỆU";
        document.getElementById('btn-cancel').classList.add('hidden');
    }

    function exportExcel() {
        const table = document.getElementById("table-to-export");
        const wb = XLSX.utils.table_to_book(table);
        XLSX.writeFile(wb, `BangCong_${document.getElementById('filterMonthYear').value}.xlsx`);
    }

    function initFilter() {
        const s = document.getElementById('filterMonthYear');
        if(s.options.length > 0) return;
        const now = new Date();
        const curMY = now.toISOString().substring(0, 7); // 2026-05

        // Tạo danh sách 12 tháng gần nhất và 12 tháng tới
        for(let i = -12; i <= 12; i++) {
            let d = new Date(now.getFullYear(), now.getMonth() + i, 1);
            let val = d.toISOString().substring(0, 7);
            let label = "Tháng " + (d.getMonth() + 1) + "/" + d.getFullYear();
            s.add(new Option(label, val, val === curMY, val === curMY));
        }
        document.getElementById('workDate').valueAsDate = now;
    }
</script>
</body>
</html>
