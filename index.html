<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Công 2026 - v2.1</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <!-- Thư viện xuất Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --primary: #0056b3; --success: #28a745; --danger: #dc3545; --warning: #ffc107; --dark: #343a40; --info: #17a2b8; }
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 8px; }
        .container { max-width: 1100px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; border: 1px solid #e1e4e8; }
        input, select { width: 100%; padding: 10px; margin: 4px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.3s; font-size: 13px; }
        .btn-main { background: var(--primary); color: white; width: 100%; padding: 12px; margin-top: 8px; text-transform: uppercase; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
        .btn-sm { padding: 8px 12px; color: white; flex: 1; min-width: 80px; text-align: center; }
        .bg-success { background: var(--success); }
        .bg-danger { background: var(--danger); }
        .bg-warning { background: var(--warning); color: black; }
        .bg-info { background: var(--info); }
        .bg-dark { background: var(--dark); }
        .hidden { display: none; }
        .table-wrapper { overflow-x: auto; background: white; border-radius: 8px; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #f8f9fa; }
        .summary-row { background: #e9ecef; font-weight: bold; }
        .preview-salary { background: #fff3cd; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center; font-weight: bold; color: #856404; border: 1px dashed #856404; }
    </style>
</head>
<body>

<div class="container">
    <!-- AUTH SECTION -->
    <div id="auth-section" class="card" style="max-width:380px; margin:40px auto;">
        <h2 id="auth-title" style="text-align:center; font-size: 20px;">Đăng Nhập</h2>
        <div id="reg-fields" class="hidden">
            <label style="font-size:13px">Họ và Tên</label>
            <input type="text" id="fullName" placeholder="Họ tên">
        </div>
        <label style="font-size:13px">Email</label>
        <input type="email" id="email" placeholder="email@gmail.com">
        <label style="font-size:13px">Mật khẩu</label>
        <input type="password" id="password" placeholder="••••••">
        <div id="retype-reg-fields" class="hidden">
            <label style="font-size:13px">Nhập lại mật khẩu</label>
            <input type="password" id="repassword" placeholder="••••••">
        </div>
        <button class="btn-main" id="btn-auth" onclick="handleAuth()">Đăng Nhập</button>
        <p style="text-align:center; color: var(--primary); cursor:pointer; font-size:13px; margin-top:12px;" onclick="toggleAuth()" id="toggle-text">Chưa có tài khoản? Đăng ký ngay</p>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content" class="hidden">
        <div class="card" style="display:flex; justify-content: space-between; align-items:center; padding: 10px 15px;">
            <div style="font-size:14px">Chào: <b id="user-name" style="color: var(--primary);"></b></div>
            <div style="display:flex; gap:5px;">
                <button onclick="logout()" class="btn-sm bg-danger" style="flex:none">Thoát</button>
            </div>
        </div>

        <div id="tab-cong">
            <div class="card">
                <h3 id="form-title" style="margin-top:0; font-size:16px;">Nhập Công</h3>
                <input type="hidden" id="edit-id">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div style="grid-column: span 2;"><label style="font-size:12px">Ngày</label><input type="date" id="workDate"></div>
                    <div><label style="font-size:12px">Giờ vào</label><input type="time" id="timeIn" value="08:00" oninput="calculatePreview()"></div>
                    <div><label style="font-size:12px">Giờ ra</label><input type="time" id="timeOut" value="17:00" oninput="calculatePreview()"></div>
                    <div><label style="font-size:12px">Giải lao (phút)</label><input type="number" id="breakMin" value="45" oninput="calculatePreview()"></div>
                </div>
                
                <div id="salary-preview" class="preview-salary">Tiền công: 0 ¥</div>
                
                <button class="btn-main" onclick="saveData()" id="btn-save">LƯU DỮ LIỆU</button>
                <button id="btn-cancel" class="hidden" onclick="resetForm()" style="width:100%; margin-top:5px; background:#6c757d; color:white; padding:10px">Hủy bỏ</button>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; margin-bottom:10px">
                    <select id="filterMonth" style="width:140px;" onchange="loadData()"></select>
                    <button class="btn-sm bg-success" onclick="exportExcel()">📥 XUẤT EXCEL</button>
                </div>
                <div class="table-wrapper">
                    <table id="table-to-export">
                        <thead><tr id="table-header"></tr></thead>
                        <tbody id="dataBody"></tbody>
                        <tfoot id="dataFooter"></tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // CHÈN FIREBASE CONFIG CỦA BẠN VÀO ĐÂY
    const firebaseConfig = {
        apiKey: "AIzaSyDzp1rjYmoxb8iFfMd0mcwgqeVimP4LXkw",
        authDomain: "quanlyluong2026.firebaseapp.com",
        projectId: "quanlyluong2026",
        storageBucket: "quanlyluong2026.firebasestorage.app",
        messagingSenderId: "293176773446",
        appId: "1:293176773446:web:f736157bfdbce598fab347"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const ADMIN_LIST = ["admin@1177.com", "phamvantan@gmail.com"];
    const RATE_BASE = 1177;
    const RATE_OT = 1177 * 1.25;
    let isLoginMode = true;

    // --- AUTH LOGIC ---
    function toggleAuth() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
        document.getElementById('btn-auth').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
        document.getElementById('reg-fields').classList.toggle('hidden', isLoginMode);
        document.getElementById('retype-reg-fields').classList.toggle('hidden', isLoginMode);
    }

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            if (isLoginMode) {
                await auth.signInWithEmailAndPassword(email, pass);
            } else {
                const name = document.getElementById('fullName').value;
                const res = await auth.createUserWithEmailAndPassword(email, pass);
                await res.user.updateProfile({ displayName: name });
                await db.collection("users").doc(res.user.uid).set({ ho_ten: name, email: email });
            }
        } catch (e) { alert("Lỗi: " + e.message); }
    }

    function logout() { auth.signOut(); location.reload(); }

    // --- CALCULATION LOGIC ---
    function getCalc() {
        const tIn = document.getElementById('timeIn').value;
        const tOut = document.getElementById('timeOut').value;
        const bMin = parseInt(document.getElementById('breakMin').value) || 0;
        
        const start = new Date(`2026-01-01 ${tIn}`);
        let end = new Date(`2026-01-01 ${tOut}`);
        if (end < start) end.setDate(end.getDate() + 1);
        
        let totalHrs = (end - start) / 3600000 - (bMin / 60);
        totalHrs = Math.max(0, totalHrs);
        
        let basic = Math.min(8, totalHrs);
        let ot = Math.max(0, totalHrs - 8);
        let money = (basic * RATE_BASE) + (ot * RATE_OT);
        
        return { basic: basic.toFixed(2), ot: ot.toFixed(2), money: Math.round(money) };
    }

    function calculatePreview() {
        const res = getCalc();
        document.getElementById('salary-preview').innerText = `Dự tính: ${res.basic}h + ${res.ot}h OT = ${res.money.toLocaleString()} ¥`;
    }

    // --- DATA LOGIC ---
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('user-name').innerText = user.displayName || user.email;
            initFilter();
            renderTableHeader(ADMIN_LIST.includes(user.email));
            loadData();
            calculatePreview();
        } else {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
        }
    });

    function renderTableHeader(isAdmin) {
        let h = `<th>Ngày</th><th>Họ Tên</th><th>Giờ</th><th>Công</th><th>TC</th><th>Tiền Yên</th>`;
        h += `<th>Thao tác</th>`;
        document.getElementById('table-header').innerHTML = h;
    }

    async function saveData() {
        const user = auth.currentUser;
        const id = document.getElementById('edit-id').value;
        const date = document.getElementById('workDate').value;
        if(!date) return alert("Chọn ngày!");

        const res = getCalc();
        const data = {
            uid: user.uid, ho_ten: user.displayName || user.email,
            ngay: date, gio_vao: document.getElementById('timeIn').value,
            gio_ra: document.getElementById('timeOut').value,
            giai_lao: parseInt(document.getElementById('breakMin').value),
            gio_lam: res.basic, tang_ca: res.ot, thanh_tien: res.money,
            thang: date.substring(5, 7), status: "pending"
        };

        try {
            if(id) await db.collection("bang_luong").doc(id).update(data);
            else await db.collection("bang_luong").add(data);
            alert("Đã lưu!");
            resetForm();
        } catch(e) { alert("Lỗi khi lưu: " + e.message); }
    }

    function loadData() {
        const user = auth.currentUser;
        const month = document.getElementById('filterMonth').value;
        const isAdmin = ADMIN_LIST.includes(user.email);
        let q = db.collection("bang_luong").where("thang", "==", month);
        if (!isAdmin) q = q.where("uid", "==", user.uid);

        q.onSnapshot(snapshot => {
            let html = '';
            let sHrs = 0, sOt = 0, sPay = 0;
            snapshot.forEach(doc => {
                const d = doc.data();
                sHrs += parseFloat(d.gio_lam); sOt += parseFloat(d.tang_ca); sPay += parseInt(d.thanh_tien);
                html += `<tr>
                    <td>${d.ngay}</td><td>${d.ho_ten}</td><td>${d.gio_vao}-${d.gio_ra}</td>
                    <td>${d.gio_lam}</td><td>${d.tang_ca}</td><td>${d.thanh_tien.toLocaleString()}</td>
                    <td><button class="btn-sm bg-warning" onclick="editData('${doc.id}','${d.ngay}','${d.gio_vao}','${d.gio_ra}',${d.giai_lao})">Sửa</button></td>
                </tr>`;
            });
            document.getElementById('dataBody').innerHTML = html;
            document.getElementById('dataFooter').innerHTML = `
                <tr class="summary-row">
                    <td colspan="3">TỔNG CỘNG</td><td>${sHrs.toFixed(2)}</td><td>${sOt.toFixed(2)}</td>
                    <td colspan="2" style="color:red">${sPay.toLocaleString()} ¥</td>
                </tr>`;
        });
    }

    function editData(id, date, tIn, tOut, bMin) {
        document.getElementById('edit-id').value = id;
        document.getElementById('workDate').value = date;
        document.getElementById('timeIn').value = tIn;
        document.getElementById('timeOut').value = tOut;
        document.getElementById('breakMin').value = bMin;
        document.getElementById('btn-save').innerText = "CẬP NHẬT";
        document.getElementById('btn-cancel').classList.remove('hidden');
        calculatePreview();
        window.scrollTo(0,0);
    }

    function resetForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('btn-save').innerText = "LƯU DỮ LIỆU";
        document.getElementById('btn-cancel').classList.add('hidden');
    }

    function exportExcel() {
        const table = document.getElementById("table-to-export");
        const wb = XLSX.utils.table_to_book(table);
        XLSX.writeFile(wb, `BangCong_${document.getElementById('filterMonth').value}.xlsx`);
    }

    function initFilter() {
        const s = document.getElementById('filterMonth');
        if(s.options.length > 0) return;
        for(let i=1; i<=12; i++) {
            let v = i < 10 ? '0'+i : i;
            s.add(new Option("Tháng " + v, v, i == new Date().getMonth()+1, i == new Date().getMonth()+1));
        }
        document.getElementById('workDate').valueAsDate = new Date();
    }
</script>
</body>
</html>
