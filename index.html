<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Theo dõi giờ làm hoa quả - Fixed</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f5; margin: 0; padding: 10px; }
        .container { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 1000px; margin: auto; }
        .hidden { display: none; }
        input, button, select { width: 100%; padding: 12px; margin: 5px 0; border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button.admin-btn { background: #28a745; }
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f8f9fa; position: sticky; top: 0; }
        .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .summary-section { margin-top: 25px; padding: 15px; border: 2px solid #28a745; border-radius: 8px; background: #f9fff9; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-form">
        <h2 style="text-align: center;">Hệ Thống Theo dõi giờ làm hoa quả</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button onclick="login()">ĐĂNG NHẬP</button>
    </div>

    <div id="main-content" class="hidden">
        <div class="header-info">
            <div id="user-display" style="font-weight: bold;"></div>
            <button onclick="logout()" style="width: auto; background: #dc3545; padding: 5px 10px;">Thoát</button>
        </div>

        <div style="background: #e7f3ff; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
            <h3 style="margin-top:0;">Nhập Công</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <input type="date" id="workDate">
                <input type="number" id="breakMin" value="45" placeholder="Nghỉ (phút)">
                <input type="time" id="timeIn" value="08:00">
                <input type="time" id="timeOut" value="17:00">
            </div>
            <button onclick="saveData()" style="margin-top: 10px; background: #0056b3;">LƯU DỮ LIỆU</button>
        </div>

        <div style="display: flex; gap: 5px; align-items: center;">
            <label style="white-space: nowrap;">Tháng: </label>
            <select id="filterMonth" onchange="loadData()">
                <option value="01">01</option><option value="02">02</option><option value="03">03</option>
                <option value="04">04</option><option value="05" selected>05</option><option value="06">06</option>
                <option value="07">07</option><option value="08">08</option><option value="09">09</option>
                <option value="10">10</option><option value="11">11</option><option value="12">12</option>
            </select>
            <button class="admin-btn" onclick="exportDetail()" style="width: auto;">Excel</button>
        </div>

        <div class="table-responsive">
            <table id="detailTable">
                <thead>
                    <tr>
                        <th>Ngày</th><th>Tên</th><th>Vào</th><th>Ra</th><th>Công</th><th>TC</th><th>Tiền</th>
                    </tr>
                </thead>
                <tbody id="detailBody"></tbody>
            </table>
        </div>

        <div id="admin-only-section" class="hidden summary-section">
            <h3 style="color: #28a745; margin-top:0;">Tổng Hợp Lương</h3>
            <button class="admin-btn" onclick="exportSummary()">XUẤT TỔNG HỢP (EXCEL)</button>
            <div class="table-responsive">
                <table id="summaryTable">
                    <thead>
                        <tr>
                            <th>STT</th><th>Tên</th><th>Ngày</th><th>Giờ</th><th>TC</th><th>Tiền</th>
                        </tr>
                    </thead>
                    <tbody id="summaryBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDzp1rjYmoxb8iFfMd0mcwgqeVimP4LXkw",
        authDomain: "quanlyluong2026.firebaseapp.com",
        projectId: "quanlyluong2026",
        storageBucket: "quanlyluong2026.firebasestorage.app",
        messagingSenderId: "293176773446",
        appId: "1:293176773446:web:f736157bfdbce598fab347"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const ADMIN_EMAIL = "admin@1177.com";

    function login() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(e, p).catch(err => alert("Lỗi: " + err.message));
    }

    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('user-display').innerText = "User: " + user.email.split('@')[0];
            document.getElementById('workDate').valueAsDate = new Date();
            
            if(user.email === ADMIN_EMAIL) document.getElementById('admin-only-section').classList.remove('hidden');
            loadData();
        } else {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
        }
    });

    async function saveData() {
        const user = auth.currentUser;
        const date = document.getElementById('workDate').value;
        if(!date) return alert("Chưa chọn ngày!");
        
        const monthInput = date.substring(5, 7);
        const tIn = document.getElementById('timeIn').value;
        const tOut = document.getElementById('timeOut').value;
        const bMin = parseInt(document.getElementById('breakMin').value) || 0;

        const start = new Date(`2026-01-01 ${tIn}`);
        const end = new Date(`2026-01-01 ${tOut}`);
        let diff = (end - start) / 3600000;
        if (diff < 0) diff += 24;
        let totalHrs = Math.max(0, diff - (bMin / 60));

        let basic = totalHrs > 8 ? 8 : totalHrs;
        let ot = totalHrs > 8 ? (totalHrs - 8) : 0;
        let money = (basic * 1177) + (ot * 1177 * 1.25);

        try {
            await db.collection("bang_luong").add({
                uid: user.uid, email: user.email, ngay: date,
                gio_vao: tIn, gio_ra: tOut, gio_nghi: bMin,
                tong_gio: totalHrs.toFixed(2), gio_co_ban: basic.toFixed(2),
                gio_tang_ca: ot.toFixed(2), thanh_tien: Math.round(money),
                thang: monthInput
            });
            
            // Tự động chuyển bộ lọc về tháng vừa nhập để thấy dữ liệu nhảy ra
            document.getElementById('filterMonth').value = monthInput;
            loadData();
            
            alert("Lưu thành công!");
        } catch(e) { alert("Lỗi lưu: " + e); }
    }

    function loadData() {
        const user = auth.currentUser;
        const month = document.getElementById('filterMonth').value;
        
        // Bỏ orderBy để tránh lỗi Index Firebase chưa khởi tạo
        let query = db.collection("bang_luong").where("thang", "==", month);
        
        if (user.email !== ADMIN_EMAIL) query = query.where("uid", "==", user.uid);

        query.onSnapshot(snapshot => {
            let detailHtml = '';
            let summaryData = {};
            
            // Tự sắp xếp thủ công bằng Javascript thay vì Firestore
            let docs = [];
            snapshot.forEach(d => docs.push(d.data()));
            docs.sort((a, b) => a.ngay.localeCompare(b.ngay));

            docs.forEach(d => {
                const name = d.email.split('@')[0].toUpperCase();
                detailHtml += `<tr>
                    <td>${d.ngay.substring(8,10)}/${d.ngay.substring(5,7)}</td>
                    <td>${name}</td>
                    <td>${d.gio_vao}</td>
                    <td>${d.gio_ra}</td>
                    <td>${d.gio_co_ban}</td>
                    <td style="color:red">${d.gio_tang_ca}</td>
                    <td>${d.thanh_tien.toLocaleString()}</td>
                </tr>`;

                if (!summaryData[name]) {
                    summaryData[name] = { count: 0, totalHrs: 0, totalOt: 0, totalMoney: 0 };
                }
                summaryData[name].count += 1;
                summaryData[name].totalHrs += parseFloat(d.tong_gio);
                summaryData[name].totalOt += parseFloat(d.gio_tang_ca);
                summaryData[name].totalMoney += d.thanh_tien;
            });

            document.getElementById('detailBody').innerHTML = detailHtml;

            if (user.email === ADMIN_EMAIL) {
                let summaryHtml = '';
                let stt = 1;
                for (let name in summaryData) {
                    summaryHtml += `<tr>
                        <td>${stt++}</td>
                        <td style="text-align:left;">${name}</td>
                        <td>${summaryData[name].count}</td>
                        <td>${summaryData[name].totalHrs.toFixed(2)}</td>
                        <td>${summaryData[name].totalOt.toFixed(2)}</td>
                        <td style="font-weight:bold;">${summaryData[name].totalMoney.toLocaleString()}</td>
                    </tr>`;
                }
                document.getElementById('summaryBody').innerHTML = summaryHtml;
            }
        });
    }

    function exportDetail() {
        const wb = XLSX.utils.table_to_book(document.getElementById("detailTable"));
        XLSX.writeFile(wb, "Chi_tiet_luong.xlsx");
    }

    function exportSummary() {
        const wb = XLSX.utils.table_to_book(document.getElementById("summaryTable"));
        XLSX.writeFile(wb, "Tong_hop_luong.xlsx");
    }
</script>
</body>
</html>
